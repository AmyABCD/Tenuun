<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090f22"><title>ТЭНҮҮН — Neon X/O</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1a2e58,#080c1b 72%);color:#edf5ff;font-family:system-ui,Arial}main{max-width:510px;margin:auto;padding:24px 16px 50px}h1{text-align:center;font-size:clamp(38px,10vw,60px);letter-spacing:4px;margin:12px 0 0;text-shadow:0 0 24px #00dfff}h2{text-align:center;color:#b2c4e6;font-size:14px;letter-spacing:5px;margin:0 0 22px}.panel{background:#121e39;border:1px solid #2a4067;border-radius:16px;padding:15px;margin:12px 0}.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}button,input{font:inherit;border-radius:10px;padding:12px;border:1px solid #41577f}input{background:#09152b;color:#fff;width:100%;margin:8px 0}button{background:#243756;color:white;cursor:pointer;font-weight:700}button.active{border-color:#60edff;color:#7ef1ff;box-shadow:0 0 12px #20dfff66}button.primary{background:linear-gradient(90deg,#00c9e8,#7971fc);color:#061327;border:0}button:disabled{opacity:.55;cursor:default}.muted{color:#a7bad7;font-size:13px}.hide{display:none!important}#board{display:grid;gap:8px;max-width:420px;margin:20px auto}.cell{aspect-ratio:1;padding:0;font-size:clamp(24px,9vw,55px);background:#111e39;border:1px solid #39537a;border-radius:12px}.cell.x{color:#65f0ff;text-shadow:0 0 20px #00e5ff}.cell.o{color:#ff7cc8;text-shadow:0 0 20px #ff3aa9}.cell.win{background:#36506b;border-color:#ffe28a;box-shadow:0 0 14px #ffe28a88}.score{font-size:34px;font-weight:900}.center{text-align:center}.status{font-weight:800;text-align:center;font-size:17px;color:#f6df88}.pill{border-radius:10px;padding:8px;background:#0a142a}.small{font-size:12px}#msg{color:#ffb4c6;text-align:center;min-height:22px}</style></head><body><main><h1>ТЭНҮҮН</h1><h2><span style="color:#6af2ff">X</span> / <span style="color:#ff83c9">O</span> • NEON ARENA</h2>
<section id="lobby"><div class="panel"><label>Таны нэр</label><input id="name" maxlength="20" placeholder="Нэрээ бичээрэй" value="Тоглогч 1"><p class="muted">Талбарын хэмжээ</p><div class="row"><button id="three" class="active">3 × 3</button><button id="five">5 × 5</button></div><p class="muted">Тоглох хэлбэр</p><div class="row"><button id="online" class="active">🌐 Онлайн</button><button id="ai">🤖 Боттой</button></div><button class="primary" id="create" style="width:100%;margin-top:15px">Өрөө үүсгэх</button></div><div class="panel"><label>Өрөөний 6 оронтой код</label><input id="code" inputmode="numeric" maxlength="6" placeholder="123456"><button id="join" style="width:100%">Өрөөнд нэгдэх</button></div></section>
<section id="game" class="hide"><div class="panel center"><div class="muted">Өрөөний код</div><div id="roomCode" style="font-size:28px;font-weight:900;letter-spacing:4px"></div><button id="share">🔗 Урилгын холбоос хуулах</button></div><div class="row"><div class="panel center"><div id="xn" class="muted"></div><div class="score" style="color:#68eaff" id="xs">0</div></div><div class="panel center"><div id="on" class="muted"></div><div class="score" style="color:#ff82c6" id="os">0</div></div></div><div class="panel"><div class="status" id="status"></div><div class="muted center" id="round"></div></div><div id="board"></div><div class="row"><button class="primary" id="next">Дараагийн үе</button><button id="restart">Шинээр эхлэх</button></div><p class="muted center">3×3 дээр 3, 5×5 дээр 4 тэмдэг дараалуулж хожно. Түрүүлж 3 үе хожсон нь аварга!</p></section><p id="msg"></p></main><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id),socket=io();let n=3,ai=false,my=null,st=null,token=null;
function message(m){$('msg').textContent=m;setTimeout(()=>{if($('msg').textContent===m)$('msg').textContent=''},4500)}
function choose(a,b,on){$(a).onclick=()=>{$(a).classList.add('active');$(b).classList.remove('active');on()}}
choose('three','five',()=>n=3);choose('five','three',()=>n=5);choose('online','ai',()=>ai=false);choose('ai','online',()=>ai=true);
$('create').onclick=()=>socket.emit('create',{name:$('name').value,n,bot:ai});
$('join').onclick=()=>socket.emit('join',{code:$('code').value,name:$('name').value});
socket.on('errorMessage',message);
socket.on('joined',d=>{my=d.sym;token=d.token;sessionStorage.setItem('tenuun-'+d.code,token);$('lobby').classList.add('hide');$('game').classList.remove('hide');history.replaceState({},'',location.pathname+'?room='+d.code);$('roomCode').textContent=d.code;message('Өрөөнд амжилттай холбогдлоо')});
socket.on('state',s=>{st=s;render()});
function render(){if(!st)return;$('roomCode').textContent=st.code;$('xn').textContent='❌ '+(st.players.X?.name||'Тоглогч 1');$('on').textContent='⭕ '+(st.players.O?.name||'Хүлээж байна');$('xs').textContent=st.scores.X;$('os').textContent=st.scores.O;$('round').textContent=st.round+'-р үе • 3 ялалт хүртэл';let winner=st.champion;if(winner)$('status').textContent='🏆 '+st.players[winner].name+' АВАРГА БОЛЛОО!';else if(st.finished)$('status').textContent=st.line.length?'🎉 '+st.players[st.starter].name+' хожлоо! Дараагийн үеийг эхэлнэ':'🤝 Тэнцлээ!';else if(!st.players.O)$('status').textContent='Хоёр дахь тоглогчийг хүлээж байна';else $('status').textContent=(st.players[st.turn]?.name||'Тоглогч')+'-ийн ээлж';$('next').disabled=!st.finished||!!winner||my!=='X';$('restart').disabled=my!=='X';let b=$('board');b.style.gridTemplateColumns='repeat('+st.n+',minmax(0,1fr))';b.innerHTML='';st.board.forEach((v,i)=>{let e=document.createElement('button');e.className='cell '+(v?v.toLowerCase():'')+(st.line.includes(i)?' win':'');e.textContent=v||'';e.disabled=!!v||st.finished||st.turn!==my||!st.players.O;e.onclick=()=>socket.emit('move',i);b.appendChild(e)})}
$('next').onclick=()=>socket.emit('next');$('restart').onclick=()=>socket.emit('restart');
$('share').onclick=async()=>{let url=location.origin+'/?room='+st.code;try{if(navigator.share)await navigator.share({title:'ТЭНҮҮН X/O',url});else{await navigator.clipboard.writeText(url);message('Урилгын холбоос хуулагдлаа')}}catch{message(url)}};
let c=new URLSearchParams(location.search).get('room');if(c){$('code').value=c;let t=sessionStorage.getItem('tenuun-'+c);if(t)socket.on('connect',()=>socket.emit('join',{code:c,token:t}));}
</script></body></html>
