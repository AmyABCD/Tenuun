<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#06091a"><title>ТЭНҮҮН • Neon X/O</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:radial-gradient(ellipse at 50% -15%,#24358c,#080c28 55%,#040611);color:#f6faff;font:600 14px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}#app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);overflow:hidden}.logo{text-align:center;font-weight:1000;font-size:clamp(27px,5.3dvh,45px);line-height:1.15;letter-spacing:4px;color:#fff;text-shadow:0 0 8px #42e9ff,0 0 24px #00dfff,0 0 48px #008dff;margin:5px 0 1px}.subtitle{text-align:center;font-size:10px;letter-spacing:5px;color:#ff9ce6;text-shadow:0 0 12px #ff43bc;margin:0 0 7px}.panel{background:linear-gradient(135deg,#16245bde,#0d1640ee);border:1px solid #4d7ffb;border-radius:15px;box-shadow:inset 0 0 20px #244fce33,0 0 14px #1c5fff38;padding:10px;margin-bottom:8px}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.btn{background:#162553;border:1px solid #5a83ee;border-radius:11px;color:white;padding:9px 8px;font-weight:800;box-shadow:0 0 9px #2472ff55}.btn.active{border-color:#65ffff;box-shadow:0 0 9px #00eaff, inset 0 0 10px #00eaff55;color:#a9ffff}.primary{background:linear-gradient(100deg,#00e4ff,#a077ff);border:0;color:#07102a;box-shadow:0 0 15px #00dfff88}.input{width:100%;background:#070f2d;border:1px solid #5d85d8;color:white;border-radius:10px;padding:10px;margin:4px 0 8px;outline:none}.label{color:#a4c4ff;font-size:12px}.muted{font-size:11px;color:#a8bbde}.hidden{display:none!important}#lobby{display:flex;flex-direction:column;justify-content:center;flex:1;min-height:0}#game{flex:1;min-height:0;display:flex;flex-direction:column}#topline{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 7px;margin-bottom:6px}.code{letter-spacing:2px;font-size:18px;color:#8cffff;text-shadow:0 0 12px #00f7ff}.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}.player{background:#111e50;border:1px solid #3570ff;border-radius:12px;padding:6px;text-align:center;box-shadow:0 0 12px #2874ff66;min-width:0}.player:nth-child(2){border-color:#e355c9;box-shadow:0 0 12px #f42bba66}.player .nm{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player .sc{font-size:clamp(20px,4dvh,30px);font-weight:1000;color:#79f7ff;text-shadow:0 0 12px #00eaff}.player:nth-child(2) .sc{color:#ff8bdd;text-shadow:0 0 12px #ff2bad}.status{text-align:center;font-weight:900;color:#fff4a1;text-shadow:0 0 13px #ffd53b;font-size:clamp(12px,2.3dvh,16px);padding:4px 0}.round{text-align:center;color:#99b6e9;font-size:10px}.boardWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 0}.board{width:min(100%,calc(100dvh - 300px),410px);aspect-ratio:1;display:grid;gap:clamp(5px,1vw,10px);padding:5px;border-radius:17px;background:#07152f;box-shadow:0 0 25px #00bfff99,0 0 50px #255aff44,inset 0 0 20px #00bfff44;border:2px solid #4fe8ff}.cell{min-width:0;min-height:0;padding:0;border-radius:10px;border:1px solid #4289e9;background:linear-gradient(140deg,#152a60,#0b1638);box-shadow:inset 0 0 13px #2874ff44,0 0 7px #227bff55;color:#78faff;font-size:clamp(22px,7dvh,55px);font-weight:1000;text-shadow:0 0 7px currentColor,0 0 22px currentColor;display:grid;place-items:center}.cell.o{color:#ff80d9;border-color:#c24eae;text-shadow:0 0 9px currentColor,0 0 24px currentColor}.cell.win{border:2px solid #ffef8b;background:#384b70;box-shadow:0 0 20px #ffe356,inset 0 0 15px #ffdd6655}.cell:disabled{opacity:1}.bottom{display:flex;gap:7px;margin:5px 0}.bottom button{flex:1}.avatarbar{display:flex;gap:5px;align-items:center;justify-content:center;margin:5px 0;flex-wrap:wrap}.avatarbar button{width:clamp(32px,5dvh,42px);height:clamp(32px,5dvh,42px);padding:0;font-size:23px;border-radius:9px;border:1px solid #4266b6;background:#101d48}.avatarbar button.selected{border:2px solid #62ffff;box-shadow:0 0 13px #00f5ff}.notice{text-align:center;min-height:16px;font-size:11px;color:#ffc0e4}#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;pointer-events:none;background:#090b2788}#overlay.show{display:flex}.trophy{text-align:center;font-size:clamp(80px,18vw,125px);filter:drop-shadow(0 0 30px #ffe86d);animation:pop .6s both}.winner{font-size:27px;font-weight:1000;text-shadow:0 0 20px #ffe66e;text-align:center}.particle{position:absolute;top:-10%;width:8px;height:16px;animation:fall 2.5s linear forwards}@keyframes fall{to{transform:translateY(120vh) rotate(900deg)}}@keyframes pop{from{transform:scale(.1) rotate(-15deg)}to{transform:scale(1)}}@media(max-height:650px){.logo{font-size:26px}.subtitle{margin-bottom:3px}.panel{padding:7px;margin-bottom:5px}.board{width:min(100%,calc(100dvh - 275px),410px)}.avatarbar{margin:2px 0}.player{padding:3px}}@media(max-height:490px){.board{width:min(100%,calc(100dvh - 230px),410px)}.logo{font-size:20px}.subtitle{display:none}.avatarbar button{width:28px;height:28px;font-size:18px}}
</style><style>
#app{max-width:1700px;padding:0 clamp(10px,2vw,32px) env(safe-area-inset-bottom)}.logo{font-size:clamp(30px,5vw,70px);margin:3px 0;color:#b5faff;text-shadow:0 0 8px #42e9ff,0 0 20px #00eaff,0 0 44px #006dff,0 0 70px #008dff}.subtitle{font-size:clamp(9px,1.2vw,15px);margin-bottom:8px}.arcade{flex:1;display:grid;grid-template-columns:minmax(190px,25%) minmax(300px,1fr) minmax(190px,25%);gap:clamp(8px,1.5vw,24px);min-height:0}.centerStage{display:flex;flex-direction:column;min-height:0;max-width:630px;width:100%;margin:auto}.side{align-self:stretch;min-height:0;background:linear-gradient(145deg,#0b1c4ef0,#0a0b31e8);border:2px solid #b54eff;border-radius:25px;box-shadow:0 0 10px #e449ff,0 0 30px #c52dff77,inset 0 0 28px #9c29e933;padding:clamp(10px,1.5vw,23px);display:flex;flex-direction:column;justify-content:space-around}.side.left{border-color:#46dfff;box-shadow:0 0 10px #39eaff,0 0 30px #11cfff88,inset 0 0 28px #1d9ef533}.sideTitle{text-align:center;font-weight:900;font-size:clamp(13px,1.8vw,23px);text-shadow:0 0 15px #fff;margin:8px 0}.modeList{display:grid;gap:10px}.side .btn{padding:clamp(8px,1.3vw,18px);font-size:clamp(11px,1.3vw,18px);border:2px solid #3bb9ff;box-shadow:0 0 10px #00aeff66}.rule{text-align:center;border:2px solid #8754f6;border-radius:14px;padding:16px 5px;color:#ffe9ab;box-shadow:0 0 16px #af56ff77}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(5px,.8vw,13px)}.avatarCard{aspect-ratio:1;border:2px solid #4b8efc;border-radius:13px;background:radial-gradient(circle,#1d367b,#080d2d);font-size:clamp(22px,3vw,55px);box-shadow:0 0 10px #267eff88;display:grid;place-items:center}.avatarCard.selected{border-color:#7fffff;box-shadow:0 0 14px #00ffff, inset 0 0 10px #00ffff77}.bigCup{text-align:center;font-size:clamp(60px,10vw,170px);filter:drop-shadow(0 0 25px #ffc82b);animation:cupGlow 2s ease-in-out infinite alternate}.fireworks{text-align:center;color:#ffdc6a;font-size:30px;text-shadow:0 0 15px #ff53df}.centerStage #game{min-height:0}.centerStage .board{width:min(100%,calc(100dvh - 285px),560px);box-shadow:0 0 18px #00ffff,0 0 55px #00bfff99,inset 0 0 20px #00bfff66;border:3px solid #69faff}.centerStage .cell{border:2px solid #4befff;box-shadow:0 0 10px #00dfff88,inset 0 0 20px #0066ff55}.centerStage .cell.o{border-color:#ff5ecf;box-shadow:0 0 10px #ff39b688,inset 0 0 20px #b722d655}.centerStage .player{border-width:2px;box-shadow:0 0 16px #22ceff88}.centerStage .player:nth-child(2){box-shadow:0 0 16px #ff33b688}@keyframes cupGlow{to{filter:drop-shadow(0 0 40px #fff36a);transform:scale(1.035)}}@media(max-width:850px){.arcade{grid-template-columns:1fr}.side{display:none}.centerStage{max-width:520px}.centerStage .board{width:min(100%,calc(100dvh - 290px),440px)}.logo{font-size:clamp(28px,5dvh,45px)}.subtitle{margin-bottom:4px}}@media(max-height:540px) and (min-width:851px){.side{padding:7px}.sideTitle{margin:1px}.modeList{gap:3px}.side .btn{padding:5px}.bigCup{font-size:50px}.centerStage .board{width:min(100%,calc(100dvh - 245px),430px)}}
</style></head><body><div id="app"><header><div class="logo">ТЭНҮҮН</div><div class="subtitle">X / O ОНЛАЙН ТОГЛООМ</div></header>
<div class="arcade"><aside class="side left"><div class="sideTitle">Тоглох горим</div><div class="modeList"><button id="modeBot" class="btn">🤖 Боттой</button><button id="modeOnline" class="btn active">🌐 Онлайн (өрөө)</button><button id="modeLocal" class="btn">👥 2 хүн (нэг утас)</button></div><div class="sideTitle">Талбар</div><div class="row"><button id="side3" class="btn active">3 × 3</button><button id="side5" class="btn">5 × 5</button></div><div class="sideTitle">Ялалтын дүрэм</div><div class="rule">🏆 Түрүүлж 3 үе хожсон нь ялна!</div></aside><div class="centerStage"><section id="lobby"><div class="panel"><div class="label">Тоглогчийн нэр</div><input id="name" class="input" maxlength="20" value="Тоглогч 1"><div class="row"><button id="three" class="btn active">3 × 3</button><button id="five" class="btn">5 × 5</button></div><div class="row" style="margin-top:8px"><button id="online" class="btn active">🌐 Онлайн</button><button id="ai" class="btn">🤖 Бот</button><button id="local" class="btn">👥 2 хүн</button></div><button id="create" class="btn primary" style="width:100%;margin-top:10px">ӨРӨӨ ҮҮСГЭХ</button></div><div class="panel"><div class="label">Найзын өрөөний код</div><input id="code" class="input" inputmode="numeric" maxlength="6" placeholder="6 оронтой код"><button id="join" class="btn" style="width:100%">ӨРӨӨНД НЭГДЭХ</button></div></section>
<section id="game" class="hidden"><div id="topline" class="panel"><span>Өрөө <strong id="roomCode" class="code"></strong></span><button id="share" class="btn">🔗 Урих</button><button id="sound" class="btn" style="flex:0">🔊</button></div><div class="scores"><div class="player"><div id="xn" class="nm"></div><div id="xs" class="sc">0</div></div><div class="player"><div id="on" class="nm"></div><div id="os" class="sc">0</div></div></div><div class="status" id="status"></div><div class="round" id="round"></div><div class="boardWrap"><div id="board" class="board"></div></div><div class="avatarbar" id="avatars"></div><div class="bottom"><button id="next" class="btn primary">Дараагийн үе</button><button id="restart" class="btn">Шинээр эхлэх</button></div><div class="notice" id="msg"></div></section></div><aside class="side right"><div class="sideTitle">Дүр сонгох</div><div id="avatarGallery" class="gallery"></div><div class="sideTitle">Ялалтын цом</div><div class="bigCup">🏆</div><div class="fireworks">✦ ✧ ✹ ✦</div></aside></div><div class="notice" id="lobbyMsg"></div></div><div id="overlay"><div><div class="trophy">🏆</div><div class="winner" id="winnerText"></div></div></div><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id),socket=io(),icons={X:'X',O:'O',semi:'🟨',robot:'🤖',ninja:'🥷',star:'⭐',cat:'🐱',ghost:'👻'};let n=3,ai=false,local=false,my=null,st=null,token=null,audio=null,soundOn=true,lastResult='',overlayTimer;
function sound(freq=550,dur=.12,type='sine'){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(80,freq/2),audio.currentTime+dur);g.gain.setValueAtTime(.14,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function message(t){$('msg').textContent=t;$('lobbyMsg').textContent=t}
function toggle(a,b,fn){$(a).onclick=()=>{$(a).classList.add('active');$(b).classList.remove('active');fn()}}
toggle('three','five',()=>{n=3;syncModes()});toggle('five','three',()=>{n=5;syncModes()});function setMode(mode){ai=mode==='bot';local=mode==='local';for(let [id,v] of [['online','online'],['ai','bot'],['local','local'],['modeOnline','online'],['modeBot','bot'],['modeLocal','local']])$(id).classList.toggle('active',v===mode)}function syncModes(){$('side3').classList.toggle('active',n===3);$('side5').classList.toggle('active',n===5);$('three').classList.toggle('active',n===3);$('five').classList.toggle('active',n===5)}$('three').onclick=()=>{n=3;syncModes()};$('five').onclick=()=>{n=5;syncModes()};$('side3').onclick=()=>{n=3;syncModes()};$('side5').onclick=()=>{n=5;syncModes()};for(let [id,v] of [['online','online'],['ai','bot'],['local','local'],['modeOnline','online'],['modeBot','bot'],['modeLocal','local']])$(id).onclick=()=>setMode(v);
$('create').onclick=()=>{sound();socket.emit('create',{name:$('name').value,n,bot:ai})};$('join').onclick=()=>{sound();socket.emit('join',{code:$('code').value,name:$('name').value})};
socket.on('errorMessage',message);socket.on('joined',d=>{my=d.sym;token=d.token;sessionStorage.setItem('tenuun-'+d.code,token);$('lobby').classList.add('hidden');$('game').classList.remove('hidden');history.replaceState({},'',location.pathname+'?room='+d.code);$('roomCode').textContent=d.code;sound(750,.16);if(local)socket.emit('local');message('Холбогдлоо!')});
socket.on('state',s=>{let old=st;st=s;if(old&&s.board.filter(Boolean).length>old.board.filter(Boolean).length)sound(s.turn==='X'?460:720,.12,'triangle');if(s.finished&&!old?.finished){if(s.line.length){victory(s.champion||s.starter);for(let i=0;i<3;i++)setTimeout(()=>sound(500+i*180,.25),i*170)}else sound(220,.35)}render()});
function victory(w){clearTimeout(overlayTimer);$('winnerText').textContent=(st.players[w]?.name||'Ялагч')+' ЯЛЛАА!';let o=$('overlay');o.querySelectorAll('.particle').forEach(x=>x.remove());o.classList.add('show');for(let i=0;i<85;i++){let p=document.createElement('i');p.className='particle';p.style.left=Math.random()*100+'%';p.style.background=['#ffec56','#ff4bbb','#45eaff','#9d71ff','#fff'][i%5];p.style.animationDelay=Math.random()*.7+'s';p.style.animationDuration=(1.4+Math.random()*1.3)+'s';o.appendChild(p)}overlayTimer=setTimeout(()=>o.classList.remove('show'),2500)}
function render(){if(!st)return;$('roomCode').textContent=st.code;$('xn').textContent=(icons[st.players.X?.avatar]||'X')+' '+(st.players.X?.name||'X');$('on').textContent=(icons[st.players.O?.avatar]||'O')+' '+(st.players.O?.name||'Хүлээж байна');$('xs').textContent=st.scores.X;$('os').textContent=st.scores.O;$('round').textContent=st.round+'-р үе • 3 ялалт хүртэл';if(st.champion)$('status').textContent='🏆 '+st.players[st.champion].name+' АВАРГА!';else if(st.finished)$('status').textContent=st.line.length?'🏆 '+st.players[st.starter].name+' яллаа!':'🤝 Тэнцлээ!';else if(!st.players.O)$('status').textContent='Найзаа хүлээж байна...';else $('status').textContent=st.players[st.turn].name+'-ийн ээлж';$('next').disabled=!st.finished||!!st.champion||my!=='X';$('restart').disabled=my!=='X';let b=$('board');b.style.gridTemplateColumns='repeat('+st.n+',minmax(0,1fr))';b.innerHTML='';st.board.forEach((v,i)=>{let e=document.createElement('button');e.className='cell '+(v?v.toLowerCase():'')+(st.line.includes(i)?' win':'');e.textContent=v?(icons[st.players[v]?.avatar]||v):'';e.style.fontSize=st.n===5?'clamp(18px,5dvh,34px)':'';e.disabled=!!v||st.finished||(!local&&st.turn!==my)||!st.players.O;e.onclick=()=>socket.emit('move',i);b.appendChild(e)});let bar=$('avatars');bar.innerHTML='<span class="muted">Дүр:</span>';for(let [id,icon] of Object.entries(icons)){let btn=document.createElement('button');btn.textContent=icon;btn.title=id==='semi'?'Блок дүр':id;btn.className=(st.players[local?st.turn:my]?.avatar===id?'selected':'');btn.onclick=()=>{sound(650,.08);socket.emit('avatar',id)};bar.appendChild(btn)}renderGallery()}
$('next').onclick=()=>{sound(700);socket.emit('next')};$('restart').onclick=()=>{sound(450);socket.emit('restart')};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊':'🔇';if(soundOn)sound(600)};
$('share').onclick=async()=>{let url=location.origin+'/?room='+st.code;try{if(navigator.share)await navigator.share({title:'ТЭНҮҮН X/O',url});else{await navigator.clipboard.writeText(url);message('Холбоос хуулагдлаа')}}catch{message(url)}};
function renderGallery(){let g=$('avatarGallery');g.innerHTML='';for(let [id,icon] of Object.entries(icons)){let b=document.createElement('button');b.textContent=icon;b.className='avatarCard'+(st?.players[local?st.turn:my]?.avatar===id?' selected':'');b.title=id;b.onclick=()=>{if(st)socket.emit('avatar',id);else message('Эхлээд тоглоом эхлүүлнэ үү');sound(600,.1)};g.appendChild(b)}}renderGallery();let c=new URLSearchParams(location.search).get('room');if(c){$('code').value=c;let t=sessionStorage.getItem('tenuun-'+c);if(t)socket.on('connect',()=>socket.emit('join',{code:c,token:t}))}
</script></body></html>
