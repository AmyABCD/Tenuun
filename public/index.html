function sound(freq=550,dur=.12,type='sine'){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(80,freq/2),audio.currentTime+dur);g.gain.setValueAtTime(.14,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function message(t){$('msg').textContent=t;$('lobbyMsg').textContent=t}
function toggle(a,b,fn){$(a).onclick=()=>{$(a).classList.add('active');$(b).classList.remove('active');fn()}}
toggle('three','five',()=>{n=3;syncModes()});toggle('five','three',()=>{n=5;syncModes()});function setMode(mode){ai=mode==='bot';local=mode==='local';for(let [id,v] of [['online','online'],['ai','bot'],['local','local'],['modeOnline','online'],['modeBot','bot'],['modeLocal','local']])$(id).classList.toggle('active',v===mode)}function syncModes(){$('side3').classList.toggle('active',n===3);$('side5').classList.toggle('active',n===5);$('three').classList.toggle('active',n===3);$('five').classList.toggle('active',n===5)}$('three').onclick=()=>{n=3;syncModes()};$('five').onclick=()=>{n=5;syncModes()};$('side3').onclick=()=>{n=3;syncModes()};$('side5').onclick=()=>{n=5;syncModes()};for(let [id,v] of [['online','online'],['ai','bot'],['local','local'],['modeOnline','online'],['modeBot','bot'],['modeLocal','local']])$(id).onclick=()=>setMode(v);
$('create').onclick=()=>{sound();socket.emit('create',{name:$('name').value,n,bot:ai})};$('join').onclick=()=>{sound();socket.emit('join',{code:$('code').value,name:$('name').value})};
socket.on('errorMessage',message);socket.on('joined',d=>{my=d.sym;token=d.token;sessionStorage.setItem('tenuun-'+d.code,token);$('lobby').classList.add('hidden');$('game').classList.remove('hidden');history.replaceState({},'',location.pathname+'?room='+d.code);$('roomCode').textContent=d.code;sound(750,.16);if(local)socket.emit('local');message('Холбогдлоо!')});
socket.on('state',s=>{let old=st;st=s;if(old&&s.board.filter(Boolean).length>old.board.filter(Boolean).length)sound(s.turn==='X'?460:720,.12,'triangle');if(s.finished&&!old?.finished){if(s.line.length){victory(s.champion||s.starter);for(let i=0;i<3;i++)setTimeout(()=>sound(500+i*180,.25),i*170)}else sound(220,.35)}render()});
function victory(w){clearTimeout(overlayTimer);$('winnerText').textContent=(st.players[w]?.name||'Ялагч')+' ЯЛЛАА!';let o=$('overlay');o.querySelectorAll('.particle').forEach(x=>x.remove());o.classList.add('show');for(let i=0;i<85;i++){let p=document.createElement('i');p.className='particle';p.style.left=Math.random()*100+'%';p.style.background=['#ffec56','#ff4bbb','#45eaff','#9d71ff','#fff'][i%5];p.style.animationDelay=Math.random()*.7+'s';p.style.animationDuration=(1.4+Math.random()*1.3)+'s';o.appendChild(p)}overlayTimer=setTimeout(()=>o.classList.remove('show'),2500)}
function render(){if(!st)return;$('roomCode').textContent=st.code;$('xn').innerHTML='<span class="portrait">'+art(st.players.X?.avatar||'X')+'</span> '+(st.players.X?.name||'X');$('on').innerHTML='<span class="portrait">'+art(st.players.O?.avatar||'O')+'</span> '+(st.players.O?.name||'Хүлээж байна');$('xs').textContent=st.scores.X;$('os').textContent=st.scores.O;$('round').textContent=st.round+'-р үе • 3 ялалт хүртэл';if(st.champion)$('status').textContent='🏆 '+st.players[st.champion].name+' АВАРГА!';else if(st.finished)$('status').textContent=st.line.length?'🏆 '+st.players[st.starter].name+' яллаа!':'🤝 Тэнцлээ!';else if(!st.players.O)$('status').textContent='Найзаа хүлээж байна...';else $('status').textContent=st.players[st.turn].name+'-ийн ээлж';$('next').disabled=!st.finished||!!st.champion||my!=='X';$('restart').disabled=my!=='X';let b=$('board');b.style.gridTemplateColumns='repeat('+st.n+',minmax(0,1fr))';b.innerHTML='';st.board.forEach((v,i)=>{let e=document.createElement('button');e.className='cell '+(v?v.toLowerCase():'')+(st.line.includes(i)?' win':'');e.innerHTML=v?art(st.players[v]?.avatar||v):'';e.style.fontSize=st.n===5?'clamp(18px,5dvh,34px)':'';e.disabled=!!v||st.finished||(!local&&st.turn!==my)||!st.players.O;e.onclick=()=>socket.emit('move',i);b.appendChild(e)});let bar=$('avatars');bar.innerHTML='<span class="muted">Дүр:</span>';for(let [id,icon] of Object.entries(icons)){let btn=document.createElement('button');btn.innerHTML=art(id);btn.title=id==='semi'?'Блок дүр':id;btn.className=(st.players[local?st.turn:my]?.avatar===id?'selected':'');btn.onclick=()=>{sound(650,.08);socket.emit('avatar',id)};bar.appendChild(btn)}renderGallery()}
$('next').onclick=()=>{sound(700);socket.emit('next')};$('restart').onclick=()=>{sound(450);socket.emit('restart')};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊':'🔇';if(soundOn)sound(600)};
$('share').onclick=async()=>{let url=location.origin+'/?room='+st.code;try{if(navigator.share)await navigator.share({title:'ТЭНҮҮН X/O',url});else{await navigator.clipboard.writeText(url);message('Холбоос хуулагдлаа')}}catch{message(url)}};
function renderGallery(){let g=$('avatarGallery');g.innerHTML='';for(let [id,icon] of Object.entries(icons)){let b=document.createElement('button');b.innerHTML=art(id);b.className='avatarCard'+(st?.players[local?st.turn:my]?.avatar===id?' selected':'');b.title=id;b.onclick=()=>{if(st)socket.emit('avatar',id);else message('Эхлээд тоглоом эхлүүлнэ үү');sound(600,.1)};g.appendChild(b)}}renderGallery();$('globalSound').onclick=()=>{$('sound').click();$('globalSound').textContent=soundOn?'🔊':'🔇'};let music=false,musicLoop;function tone(){if(!music)return;sound(330,.12,'sine');setTimeout(()=>{if(music)sound(440,.12,'sine')},180)}$('music').onclick=()=>{music=!music;$('music').classList.toggle('on',music);clearInterval(musicLoop);if(music){tone();musicLoop=setInterval(tone,1100)}};$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()};let c=new URLSearchParams(location.search).get('room');if(c){$('code').value=c;let t=sessionStorage.getItem('tenuun-'+c);if(t)socket.on('connect',()=>socket.emit('join',{code:c,token:t}))}
</script></body></html>
